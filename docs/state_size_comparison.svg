<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320">
  <defs>
    <linearGradient id="tttg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="840" height="320" fill="#ffffff"/>

  <text x="420" y="30" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Streaming state: KV cache vs TTT state W</text>
  <text x="420" y="50" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">memory required to continue decoding, by context length</text>

  <!-- axes -->
  <line x1="90" y1="70" x2="90" y2="250" stroke="#334155" stroke-width="1.5"/>
  <line x1="90" y1="250" x2="800" y2="250" stroke="#334155" stroke-width="1.5"/>

  <text x="82" y="254" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">0</text>
  <text x="82" y="197" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">1 GB</text>
  <text x="82" y="144" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">2 GB</text>
  <text x="82" y="91" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">4 GB</text>

  <!-- KV cache bars -->
  <rect x="130" y="230" width="64" height="20" rx="3" fill="#3b82f6"/>
  <text x="162" y="222" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1d4ed8">4 MB</text>

  <rect x="290" y="190" width="64" height="60" rx="3" fill="#3b82f6"/>
  <text x="322" y="182" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1d4ed8">64 MB</text>

  <rect x="450" y="130" width="64" height="120" rx="3" fill="#3b82f6"/>
  <text x="482" y="122" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1d4ed8">256 MB</text>

  <rect x="640" y="70" width="64" height="180" rx="3" fill="#ef4444"/>
  <text x="672" y="62" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">4 GB</text>

  <!-- TTT constant slabs -->
  <rect x="200" y="244" width="64" height="6" rx="3" fill="url(#tttg)"/>
  <rect x="360" y="244" width="64" height="6" rx="3" fill="url(#tttg)"/>
  <rect x="520" y="244" width="64" height="6" rx="3" fill="url(#tttg)"/>
  <rect x="720" y="244" width="64" height="6" rx="3" fill="url(#tttg)"/>

  <text x="460" y="222" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#be185d">TTT state W — constant 64 KB</text>

  <!-- x labels -->
  <text x="162" y="270" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#334155">1K tokens</text>
  <text x="322" y="270" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#334155">16K tokens</text>
  <text x="482" y="270" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#334155">64K tokens</text>
  <text x="672" y="270" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#334155">1M tokens</text>

  <!-- ratios -->
  <text x="232" y="238" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#64748b">64×</text>
  <text x="392" y="198" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#64748b">1024×</text>
  <text x="552" y="138" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#64748b">4096×</text>
  <text x="752" y="78" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#be185d">65536×</text>

  <!-- legend -->
  <rect x="560" y="88" width="16" height="16" rx="3" fill="#3b82f6"/>
  <text x="584" y="101" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#334155">attention KV cache</text>
  <rect x="560" y="114" width="16" height="16" rx="3" fill="url(#tttg)"/>
  <text x="584" y="127" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#334155">TTT state W (flat)</text>
</svg>
