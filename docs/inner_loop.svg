<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430">
  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="ah2r" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#e11d48"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>

  <text x="440" y="32" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Inside a TTT layer: one token → one gradient step</text>
  <text x="440" y="52" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#64748b">the recurrent state W is trained by its own inner optimizer at inference time</text>

  <!-- input -->
  <rect x="36" y="84" width="116" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="94" y="107" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1e3a8a">input x<tspan dy="3.5" font-size="9.5">t</tspan></text>
  <text x="94" y="125" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#3b82f6">(key, value) pair</text>

  <!-- projections -->
  <rect x="216" y="64" width="150" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="291" y="88" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#4c1d95">k<tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5"> = W</tspan><tspan dy="3.5" font-size="9.5">K</tspan><tspan dy="-3.5">·x</tspan><tspan dy="3.5" font-size="9.5">t</tspan></text>

  <rect x="216" y="122" width="150" height="38" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="291" y="146" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#4c1d95">v<tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5"> = W</tspan><tspan dy="3.5" font-size="9.5">V</tspan><tspan dy="-3.5">·x</tspan><tspan dy="3.5" font-size="9.5">t</tspan></text>

  <line x1="152" y1="102" x2="212" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah2)"/>
  <line x1="152" y1="116" x2="212" y2="139" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah2)"/>

  <!-- current state -->
  <rect x="430" y="74" width="170" height="76" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="515" y="99" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#9f1239">current state W<tspan dy="3.5" font-size="10">t−1</tspan></text>
  <text x="515" y="118" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#be123c">all tokens so far,</text>
  <text x="515" y="134" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#be123c">compressed into weights</text>

  <line x1="366" y1="83" x2="426" y2="96" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah2)"/>
  <line x1="366" y1="141" x2="426" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah2)"/>

  <!-- prediction + loss -->
  <rect x="664" y="64" width="182" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="755" y="88" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#14532d">ŷ<tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5"> = f(k</tspan><tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5"> ; W</tspan><tspan dy="3.5" font-size="9.5">t−1</tspan><tspan dy="-3.5">)</tspan></text>

  <rect x="664" y="122" width="182" height="38" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="755" y="146" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#854d0e">L<tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5"> = || ŷ</tspan><tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5"> − v</tspan><tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5"> ||²</tspan></text>

  <line x1="600" y1="100" x2="660" y2="87" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah2)"/>
  <line x1="600" y1="124" x2="660" y2="137" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah2)"/>

  <!-- update -->
  <rect x="664" y="188" width="182" height="54" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="755" y="208" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9a3412">gradient update</text>
  <text x="755" y="229" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7c2d12">W<tspan dy="3.5" font-size="10">t</tspan><tspan dy="-3.5"> = W</tspan><tspan dy="3.5" font-size="10">t−1</tspan><tspan dy="-3.5"> − η∇L</tspan><tspan dy="3.5" font-size="10">t</tspan></text>

  <line x1="755" y1="160" x2="755" y2="184" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah2)"/>

  <!-- query + output -->
  <rect x="430" y="262" width="170" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="515" y="289" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1e3a8a">q<tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5"> = W</tspan><tspan dy="3.5" font-size="9.5">Q</tspan><tspan dy="-3.5">·x</tspan><tspan dy="3.5" font-size="9.5">t</tspan></text>

  <rect x="664" y="262" width="182" height="56" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="755" y="283" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#065f46">output y<tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5"> = f(q</tspan><tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5"> ; W</tspan><tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5">)</tspan></text>
  <text x="755" y="303" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#047857">reads the freshly-updated W</text>

  <line x1="755" y1="242" x2="755" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah2)"/>
  <line x1="600" y1="284" x2="660" y2="284" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah2)"/>

  <!-- recurrence carry -->
  <path d="M 664 220 C 560 240 468 214 508 156" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ah2r)"/>
  <text x="560" y="252" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e11d48">W carries to the next token</text>

  <!-- two-pass legend -->
  <rect x="36" y="210" width="330" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a">Two-pass chunked scan (causality-safe)</text>
  <text x="56" y="264" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#475569">pass 1 — snapshot outputs before update</text>
  <text x="56" y="284" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#475569">pass 2 — first-order correction within chunk</text>
  <text x="56" y="304" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#475569">→ fixes early-token peeking (leak-free)</text>
  <text x="56" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#475569">+ mean (not sum) chunk gradients</text>
  <text x="56" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#475569">+ clamped log-lr → no NaN blowup</text>
</svg>
