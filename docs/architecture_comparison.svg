<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <defs>
    <marker id="ah1" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="360" fill="#ffffff"/>

  <!-- ===================== Transformer ===================== -->
  <rect x="24" y="28" width="292" height="304" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="170" y="58" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Transformer</text>
  <text x="170" y="78" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">Attention · O(n²) FLOPs</text>

  <rect x="54" y="100" width="62" height="34" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="122" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">Q</text>
  <rect x="139" y="100" width="62" height="34" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="170" y="122" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">K</text>
  <rect x="224" y="100" width="62" height="34" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="255" y="122" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">V</text>

  <line x1="85" y1="134" x2="133" y2="154" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah1)"/>
  <line x1="170" y1="134" x2="170" y2="154" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah1)"/>
  <line x1="255" y1="134" x2="207" y2="154" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah1)"/>

  <rect x="103" y="158" width="134" height="48" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="170" y="179" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#4c1d95">softmax(QK<tspan dy="-4" font-size="9">T</tspan><tspan dy="4">/√d)·V</tspan></text>
  <text x="170" y="196" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#7c3aed">scores every pair — quadratic</text>

  <line x1="170" y1="206" x2="170" y2="228" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah1)"/>

  <rect x="64" y="232" width="212" height="76" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="170" y="256" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#a16207">KV cache grows with n</text>
  <text x="170" y="276" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#a16207">memory ∝ context length</text>
  <text x="170" y="296" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#854d0e">state size: O(n)</text>

  <!-- ===================== RNN / Mamba ===================== -->
  <rect x="334" y="28" width="292" height="304" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="58" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">RNN / Mamba</text>
  <text x="480" y="78" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">Recurrence · O(n) FLOPs</text>

  <rect x="398" y="94" width="164" height="46" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="480" y="114" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#065f46">h<tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5"> (fixed vector)</tspan></text>
  <text x="480" y="131" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#047857">bounded capacity</text>

  <line x1="480" y1="140" x2="480" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah1)"/>

  <rect x="398" y="166" width="164" height="42" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <text x="480" y="192" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#155e75">h<tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5"> = f(h</tspan><tspan dy="3.5" font-size="9.5">t−1</tspan><tspan dy="-3.5">, x</tspan><tspan dy="3.5" font-size="9.5">t</tspan><tspan dy="-3.5">)</tspan></text>

  <path d="M 562 184 C 602 184 602 122 568 119" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah1)"/>
  <text x="596" y="152" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#64748b">loop</text>

  <line x1="480" y1="208" x2="480" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah1)"/>

  <rect x="388" y="234" width="184" height="72" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="480" y="262" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#a16207">constant state,</text>
  <text x="480" y="282" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#a16207">limited expressiveness</text>

  <!-- ===================== TTT ===================== -->
  <rect x="644" y="28" width="292" height="304" rx="14" fill="#fff1f2" stroke="#ec4899" stroke-width="2.5"/>
  <text x="790" y="58" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#be185d">TTT (this repo)</text>
  <text x="790" y="78" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748b">learns online · O(n) FLOPs</text>

  <rect x="694" y="92" width="192" height="56" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="790" y="115" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#9f1239">W<tspan dy="3.5" font-size="10">t</tspan><tspan dy="-3.5"> — a neural network</tspan></text>
  <text x="790" y="134" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#be123c">the hidden state itself is trainable</text>

  <line x1="790" y1="148" x2="790" y2="168" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah1)"/>

  <rect x="694" y="172" width="192" height="64" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="790" y="192" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#9a3412">inner loop (per token)</text>
  <text x="790" y="211" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7c2d12">W<tspan dy="3" font-size="9">t</tspan><tspan dy="-3"> = W</tspan><tspan dy="3" font-size="9">t−1</tspan><tspan dy="-3"> − η∇</tspan><tspan dy="3" font-size="9">W</tspan><tspan dy="-3">L</tspan><tspan dy="3" font-size="9">t</tspan></text>
  <text x="790" y="228" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#7c2d12">y<tspan dy="3" font-size="9">t</tspan><tspan dy="-3"> = f(q</tspan><tspan dy="3" font-size="9">t</tspan><tspan dy="-3">; W</tspan><tspan dy="3" font-size="9">t</tspan><tspan dy="-3">)</tspan></text>

  <line x1="790" y1="236" x2="790" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah1)"/>

  <rect x="684" y="260" width="212" height="52" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="790" y="282" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#065f46">constant state,</text>
  <text x="790" y="301" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#065f46">expressive capacity</text>
</svg>
