<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- soft center glow -->
  <circle cx="256" cy="256" r="96" fill="url(#halo)"/>

  <!-- faint full guide ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#94a3b8" stroke-width="6" opacity="0.15"/>

  <!-- main open loop (training loop) -->
  <path d="M 181 126 A 150 150 0 1 1 331 126"
        fill="none" stroke="url(#ring)" stroke-width="40"
        stroke-linecap="round"/>

  <!-- token trail -->
  <circle cx="269" cy="107" r="11" fill="#ec4899" opacity="0.55"/>
  <circle cx="220" cy="112" r="7"  fill="#8b5cf6" opacity="0.30"/>

  <!-- comet head -->
  <circle cx="331" cy="126" r="30" fill="url(#ring)"/>

  <!-- center state node -->
  <circle cx="256" cy="256" r="26" fill="#ffffff"/>
</svg>
